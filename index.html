<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <title>Órbita — Quiz de exploración espacial</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edf3f4;
      --surface: #fbfdfc;
      --surface-alt: #eef4f3;
      --ink: #182b32;
      --muted: #60747a;
      --line: #cedbdc;
      --accent: #087f83;
      --accent-strong: #06676b;
      --accent-soft: #e0f3f1;
      --good: #13885b;
      --good-bg: #e7f8ef;
      --bad: #c34455;
      --bad-bg: #fff0f1;
      --state-ink: #fff;
      --button-ink: #fff;
      --shadow: 0 22px 70px rgb(24 54 61 / 12%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c151b;
        --surface: #14232b;
        --surface-alt: #1b3038;
        --ink: #e8f2f1;
        --muted: #9bb0b4;
        --line: #30464d;
        --accent: #56d5cc;
        --accent-strong: #80e4dc;
        --accent-soft: #203c40;
        --good: #70dfaa;
        --good-bg: #173b33;
        --bad: #ff8793;
        --bad-bg: #482831;
        --state-ink: #10201c;
        --button-ink: #10201c;
        --shadow: 0 22px 70px rgb(0 0 0 / 35%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 38px 20px 48px;
      background:
        radial-gradient(ellipse at 15% 8%, rgb(22 153 153 / 10%), transparent 32rem),
        radial-gradient(ellipse at 88% 80%, rgb(80 184 203 / 9%), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button { font: inherit; }

    .shell {
      width: min(100%, 540px);
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 25px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--accent);
      font-size: 17px;
      box-shadow: 0 3px 12px rgb(35 39 83 / 7%);
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: appear .45s ease both;
    }

    .card-content { padding: 28px 30px 30px; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .score-pill strong { color: var(--ink); }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-alt);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .4s cubic-bezier(.2, .8, .2, 1);
    }

    h1 {
      margin: 27px 0 8px;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.2;
      letter-spacing: -.045em;
    }

    h1.question-enter { animation: question-enter .4s cubic-bezier(.2, .8, .25, 1) both; }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .mascot-host {
      display: flex;
      max-width: 370px;
      min-height: 88px;
      align-items: center;
      gap: 13px;
      margin: 0 auto 17px;
      color: var(--accent);
    }

    .mascot-art {
      position: relative;
      width: 86px;
      height: 88px;
      flex: 0 0 86px;
    }

    .space-pet { width: 100%; height: 100%; overflow: visible; }
    .pet-shadow { fill: color-mix(in srgb, var(--ink) 13%, transparent); }
    .pet-suit { fill: var(--pet-suit); }
    .pet-suit-detail { fill: var(--surface); }
    .pet-fur { fill: var(--pet-fur); }
    .pet-ear-inner { fill: var(--pet-ear); }
    .pet-helmet {
      fill: color-mix(in srgb, var(--accent) 9%, var(--surface));
      stroke: color-mix(in srgb, var(--accent) 72%, var(--surface));
      stroke-width: 2.5;
    }
    .pet-helmet-glint {
      fill: none;
      stroke: var(--surface);
      stroke-linecap: round;
      stroke-width: 2.5;
      opacity: .8;
    }
    .pet-eye { fill: var(--ink); transform-box: fill-box; transform-origin: center; }
    .pet-cheek { fill: var(--bad); opacity: .65; }
    .pet-mouth {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-width: 2;
    }
    .pet-frown { display: none; }
    .pet-arm-left, .pet-arm-right, .pet-body, .pet-head {
      transform-box: fill-box;
    }
    .pet-arm-left { transform-origin: 100% 15%; }
    .pet-arm-right { transform-origin: 0 15%; }
    .pet-body { transform-origin: 50% 100%; }
    .pet-head { transform-origin: 50% 75%; }
    .pet-star {
      fill: var(--good);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    .pet-flame { fill: var(--good); transform-box: fill-box; transform-origin: 50% 0; }

    .mascot-message {
      position: relative;
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 14px 14px 14px 5px;
      background: var(--surface-alt);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      animation: bubble-in .35s cubic-bezier(.2, .8, .25, 1) both;
    }

    .mascot-message::before {
      position: absolute;
      top: 50%;
      left: -6px;
      width: 10px;
      height: 10px;
      border-bottom: 1px solid var(--line);
      border-left: 1px solid var(--line);
      background: var(--surface-alt);
      content: "";
      transform: translateY(-50%) rotate(45deg);
    }

    .pet-name { color: var(--accent); }

    @media (prefers-color-scheme: dark) {
      :root {
        --pet-fur: #ffe5ad;
        --pet-ear: #ff9eb4;
        --pet-suit: #a69cf5;
      }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --pet-fur: #fff0c8;
        --pet-ear: #f08ca5;
        --pet-suit: #797ee8;
      }
    }

    .pet-cheek { fill: #f08ca5; }
    .pet-nose { fill: #e87991; }
    .pet-eye-glint { fill: #fff; }
    .pet-ear { fill: var(--pet-fur); }

    .mascot-host[data-mood="idle"] .pet-body { animation: pet-bob 2.5s ease-in-out infinite; }
    .mascot-host[data-mood="idle"] .pet-arm-left { animation: pet-wave 2.8s ease-in-out infinite; }
    .mascot-host[data-mood="idle"] .pet-eyes { animation: pet-blink 4.2s infinite; }
    .mascot-host[data-mood="idle"] .pet-flame { animation: flame-flicker .32s ease-in-out infinite alternate; }

    .mascot-host[data-mood="correct"] .pet-body { animation: pet-hop .7s cubic-bezier(.2, .8, .25, 1); }
    .mascot-host[data-mood="correct"] .pet-arm-left { animation: pet-cheer-left .65s ease-in-out; }
    .mascot-host[data-mood="correct"] .pet-arm-right { animation: pet-cheer-right .65s ease-in-out; }
    .mascot-host[data-mood="correct"] .pet-star { animation: pet-sparkle .75s ease-out both; }
    .mascot-host[data-mood="correct"] .pet-flame { animation: flame-burst .65s ease-out; }

    .mascot-host[data-mood="incorrect"] .pet-head { animation: pet-sympathy .65s ease-in-out; }
    .mascot-host[data-mood="incorrect"] .pet-arm-right { animation: pet-comfort .55s ease-in-out; }
    .mascot-host[data-mood="incorrect"] .pet-smile { display: none; }
    .mascot-host[data-mood="incorrect"] .pet-frown { display: block; }

    .mascot-host[data-mood="result"] .pet-body,
    .mascot-host[data-mood="perfect"] .pet-body { animation: pet-hop .8s cubic-bezier(.2, .8, .25, 1) infinite; }
    .mascot-host[data-mood="result"] .pet-arm-left,
    .mascot-host[data-mood="perfect"] .pet-arm-left { animation: pet-cheer-left .8s ease-in-out infinite alternate; }
    .mascot-host[data-mood="result"] .pet-arm-right,
    .mascot-host[data-mood="perfect"] .pet-arm-right { animation: pet-cheer-right .8s ease-in-out infinite alternate; }
    .mascot-host[data-mood="result"] .pet-star,
    .mascot-host[data-mood="perfect"] .pet-star { animation: pet-sparkle 1s ease-in-out infinite alternate; }
    .mascot-host[data-mood="perfect"] .pet-flame { animation: flame-burst .7s ease-in-out infinite alternate; }

    .answers {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      border: 0;
      min-inline-size: 0;
    }

    .answer {
      display: flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      gap: 13px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 92%, var(--accent));
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
      animation: option-arrive .38s cubic-bezier(.2, .8, .25, 1) both;
      animation-delay: calc(var(--answer-index, 0) * 65ms);
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 17%, transparent);
    }

    .answer:focus-visible, .primary-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .letter {
      display: grid;
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      place-items: center;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      transition: inherit;
    }

    .answer-copy { flex: 1; font-size: 14px; font-weight: 600; }

    .answer-icon {
      color: currentColor;
      font-size: 17px;
      font-weight: 800;
      opacity: 0;
    }

    .answer.is-correct {
      border-color: var(--good);
      background: var(--good-bg);
      color: var(--good);
      animation: pop .35s ease both;
    }

    .answer.is-correct .letter { background: var(--good); color: var(--state-ink); }
    .answer.is-correct .answer-icon { opacity: 1; animation: icon-pop .32s .08s cubic-bezier(.2, 1.8, .4, 1) both; }

    .answer.is-wrong {
      border-color: var(--bad);
      background: var(--bad-bg);
      color: var(--bad);
      animation: shake .38s ease both;
    }

    .answer.is-wrong .letter { background: var(--bad); color: var(--state-ink); }
    .answer.is-wrong .answer-icon { opacity: 1; animation: icon-pop .32s .08s cubic-bezier(.2, 1.8, .4, 1) both; }

    .answer.show-correct {
      border-color: var(--good);
      color: var(--good);
    }

    .answer.show-correct .letter { background: var(--good-bg); color: var(--good); }

    .feedback {
      display: flex;
      min-height: 0;
      align-items: center;
      gap: 12px;
      margin-top: 0;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(.98);
      transition: opacity .2s ease, transform .25s cubic-bezier(.2, .8, .25, 1), min-height .2s ease, margin .2s ease, padding .2s ease, visibility .2s;
    }

    .feedback.visible {
      min-height: 68px;
      margin-top: 15px;
      padding-block: 10px;
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .feedback { position: relative; }

    .feedback.correct { border-color: color-mix(in srgb, var(--good) 38%, transparent); background: var(--good-bg); }
    .feedback.incorrect { border-color: color-mix(in srgb, var(--bad) 38%, transparent); background: var(--bad-bg); }
    .feedback-mark {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 900;
      animation: icon-pop .38s .08s cubic-bezier(.2, 1.8, .4, 1) both;
    }
    .feedback.correct .feedback-mark { background: var(--good); color: var(--state-ink); }
    .feedback.incorrect .feedback-mark { background: var(--bad); color: var(--state-ink); }
    .feedback-copy { color: var(--ink); }
    .feedback-copy strong { display: block; margin-bottom: 2px; font-size: 14px; }
    .feedback-copy span { display: block; color: var(--muted); }

    .mission-picker {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .mission-option {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      width: 100%;
      min-height: 72px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-alt);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .mission-option:hover,
    .mission-option:focus-visible {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 17%, transparent);
      outline: none;
    }

    .mission-option-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .mission-option-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .primary-button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--button-ink);
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 5px 14px color-mix(in srgb, var(--accent) 25%, transparent);
      transition: background .18s ease, transform .18s ease;
    }

    .primary-button:hover { transform: translateY(-1px); background: var(--accent-strong); }
    .primary-button[hidden] { display: none; }
    .score-pill.is-celebrating { animation: score-celebrate .55s cubic-bezier(.2, 1.5, .35, 1); }
    .progress-fill.is-advancing { animation: progress-flash .55s ease; }

    .footer-note {
      margin: 17px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .result { padding: 38px 32px 34px; text-align: center; animation: result-arrive .55s cubic-bezier(.2, .8, .25, 1) both; }
    .result { position: relative; }

    .result .mascot-host { margin: -5px auto 15px; text-align: left; }
    .result .mascot-art { width: 106px; height: 105px; flex-basis: 106px; }
    .result .mascot-message { max-width: 230px; }

    .result .eyebrow { text-align: center; }
    .result h1 { margin: 9px 0 9px; }
    .result-copy { max-width: 360px; margin: 0 auto 22px; color: var(--muted); font-size: 14px; }

    .result-score {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 23px;
      padding: 11px 19px;
      border-radius: 15px;
      background: var(--surface-alt);
    }

    .result-score strong { color: var(--accent); font-size: 29px; letter-spacing: -.05em; }
    .result-score span { color: var(--muted); font-size: 13px; font-weight: 650; }
    .result .primary-button { margin: 0 auto; }

    .confetti-burst {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--piece-size, 8px);
      height: calc(var(--piece-size, 8px) * 1.45);
      border-radius: 2px;
      background: var(--piece-color);
      opacity: 0;
      animation: confetti-flight 950ms cubic-bezier(.12, .68, .3, 1) var(--piece-delay, 0ms) both;
    }

    @keyframes appear {
      from { opacity: 1; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes question-enter {
      from { opacity: 1; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes option-arrive {
      from { opacity: 1; transform: translateY(12px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes icon-pop {
      from { opacity: 0; transform: scale(.4) rotate(-15deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes score-celebrate {
      35% { transform: scale(1.16) rotate(-3deg); }
      70% { transform: scale(.96) rotate(2deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes progress-flash {
      50% { filter: brightness(1.35); }
    }
    @keyframes result-arrive {
      from { opacity: 1; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes result-pop {
      0% { transform: scale(.65) rotate(-12deg); }
      70% { transform: scale(1.12) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes confetti-flight {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(0) scale(.4); }
      12% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(var(--piece-x), var(--piece-y)) rotate(var(--piece-rotation)) scale(.8);
      }
    }
    @keyframes pop {
      0% { transform: scale(.98); }
      60% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      22%, 66% { transform: translateX(-5px); }
      44%, 88% { transform: translateX(5px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes bubble-in {
      from { opacity: 1; transform: translateX(-6px) scale(.97); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes pet-bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }
    @keyframes pet-wave {
      0%, 75%, 100% { transform: rotate(0); }
      82% { transform: rotate(-14deg); }
      90% { transform: rotate(9deg); }
    }
    @keyframes pet-blink {
      0%, 43%, 47%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(.12); }
    }
    @keyframes pet-hop {
      0%, 100% { transform: translateY(0) rotate(0); }
      28% { transform: translateY(-10px) rotate(-5deg); }
      55% { transform: translateY(1px) rotate(4deg); }
      76% { transform: translateY(-4px) rotate(-2deg); }
    }
    @keyframes pet-cheer-left {
      0%, 100% { transform: rotate(0); }
      45% { transform: rotate(-48deg); }
    }
    @keyframes pet-cheer-right {
      0%, 100% { transform: rotate(0); }
      45% { transform: rotate(48deg); }
    }
    @keyframes pet-sympathy {
      0%, 100% { transform: rotate(0); }
      45% { transform: rotate(-9deg) translateY(2px); }
    }
    @keyframes pet-comfort {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(14deg); }
    }
    @keyframes pet-sparkle {
      0% { opacity: 0; transform: scale(.25) rotate(-25deg); }
      40% { opacity: 1; transform: scale(1.2) rotate(12deg); }
      100% { opacity: .3; transform: scale(.8) rotate(30deg); }
    }
    @keyframes flame-flicker {
      from { transform: scaleY(.8) scaleX(.85); }
      to { transform: scaleY(1.2) scaleX(1.1); }
    }
    @keyframes flame-burst {
      50% { transform: scaleY(1.8) scaleX(1.2); }
    }

    @media (max-width: 520px) {
      body { padding: 25px 14px 32px; }
      .brand { margin-bottom: 18px; }
      .card { border-radius: 20px; }
      .card-content { padding: 24px 20px 23px; }
      .result { padding: 32px 21px 28px; }
      .mascot-host { gap: 8px; }
      .mascot-art { width: 74px; height: 82px; flex-basis: 74px; }
      .mascot-message { padding: 10px 12px; font-size: 12px; }
      .result .mascot-art { width: 88px; height: 92px; flex-basis: 88px; }
      h1 { margin-top: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .confetti-burst { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Órbita, quiz espacial">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Órbita · Quiz espacial</span>
    </div>

    <section class="card" id="quiz" aria-labelledby="question">
      <div class="card-content">
        <div class="topline">
          <p class="eyebrow">Misión de exploración</p>
          <div class="score-pill" aria-live="polite" aria-label="Puntuación">
            <span aria-hidden="true">✦</span> <strong id="score">0</strong><span>puntos</span>
          </div>
        </div>

        <div class="progress-meta">
          <span id="question-count">Pregunta 1 de 10</span>
          <span id="progress-percent">10 %</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <h1 id="question" tabindex="-1"></h1>
        <p class="subtitle">Elige la respuesta correcta para continuar tu misión.</p>
        <div id="mascot-container"></div>
        <fieldset class="answers" id="answers" aria-label="Opciones de respuesta"></fieldset>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="actions">
          <button class="primary-button" id="next-button" type="button" hidden>
            Siguiente pregunta <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </section>

    <p class="footer-note" id="footer-note">10 preguntas · Sin prisa, cadete espacial</p>
  </main>

  <script>
    const questions = [
      {
        question: "¿Cuál fue el primer satélite artificial puesto en órbita?",
        answers: ["Explorer 1", "Sputnik 1", "Vostok 1", "Luna 2"],
        correct: 1,
        explanation: "La Unión Soviética lanzó Sputnik 1 el 4 de octubre de 1957."
      },
      {
        question: "¿Qué planeta visitó por primera vez una nave espacial?",
        answers: ["Marte", "Venus", "Júpiter", "Mercurio"],
        correct: 1,
        explanation: "Mariner 2 sobrevoló Venus en 1962: fue el primer encuentro exitoso con otro planeta."
      },
      {
        question: "¿Cómo se llamaba el primer ser humano que viajó al espacio?",
        answers: ["Neil Armstrong", "Alan Shepard", "Yuri Gagarin", "John Glenn"],
        correct: 2,
        explanation: "Yuri Gagarin completó una órbita terrestre en Vostok 1, en 1961."
      },
      {
        question: "¿Qué significa la sigla NASA?",
        answers: ["Agencia Nacional de Astronomía y Satélites", "Administración Nacional de Aeronáutica y el Espacio", "Alianza Norteamericana de Sistemas Aeroespaciales", "Asociación de Navegación Aérea y Ciencia Aplicada"],
        correct: 1,
        explanation: "NASA significa National Aeronautics and Space Administration."
      },
      {
        question: "¿En qué año pisó una persona la Luna por primera vez?",
        answers: ["1965", "1967", "1969", "1972"],
        correct: 2,
        explanation: "Neil Armstrong y Buzz Aldrin caminaron sobre la Luna durante la misión Apolo 11, en 1969."
      },
      {
        question: "¿Cuál es el planeta más grande de nuestro sistema solar?",
        answers: ["Saturno", "Neptuno", "Tierra", "Júpiter"],
        correct: 3,
        explanation: "Júpiter es tan grande que cabrían más de 1.300 Tierras en su interior."
      },
      {
        question: "¿Qué telescopio espacial se lanzó en 1990?",
        answers: ["James Webb", "Hubble", "Kepler", "Spitzer"],
        correct: 1,
        explanation: "El telescopio espacial Hubble fue lanzado en abril de 1990."
      },
      {
        question: "¿Qué rover de la NASA aterrizó en Marte en febrero de 2021?",
        answers: ["Curiosity", "Opportunity", "Perseverance", "Spirit"],
        correct: 2,
        explanation: "Perseverance aterrizó en el cráter Jezero el 18 de febrero de 2021."
      },
      {
        question: "¿Cómo se llama la galaxia en la que se encuentra la Tierra?",
        answers: ["Andrómeda", "Vía Láctea", "Galaxia del Sombrero", "Triángulo"],
        correct: 1,
        explanation: "Nuestro sistema solar está en la Vía Láctea, una galaxia espiral."
      },
      {
        question: "¿Qué misión llevó a los primeros humanos a la Luna?",
        answers: ["Apolo 8", "Apolo 10", "Apolo 11", "Apolo 13"],
        correct: 2,
        explanation: "Apolo 11 llevó a Neil Armstrong y Buzz Aldrin a la superficie lunar."
      }
    ];

    let questionTitle;
    let answersElement;
    let scoreElement;
    let questionCountElement;
    let progressElement;
    let progressFill;
    let progressPercent;
    let feedbackElement;
    let nextButton;
    let quizCard;
    let footerNote;
    let missionLength = 10;
    let activeQuestions = [];
    let mascotContainer;
    let currentQuestion = 0;
    let score = 0;
    let hasAnswered = false;

    function getMissionOptions() {
      return [
        { label: "Misión corta", length: 5, description: "5 preguntas" },
        { label: "Misión completa", length: 10, description: "10 preguntas" }
      ];
    }

    function renderMissionSelection() {
      quizCard.innerHTML = `
        <div class="card-content">
          <div class="topline">
            <p class="eyebrow">Nueva misión</p>
            <div class="score-pill" aria-live="polite" aria-label="Puntuación">
              <span aria-hidden="true">✦</span> <strong id="score">0</strong><span>puntos</span>
            </div>
          </div>
          <h1 id="question" tabindex="-1">¿Cuánto tiempo quieres dedicar?</h1>
          <p class="subtitle">Elige una misión antes de despegar.</p>
          <div class="mission-picker" role="group" aria-label="Duración de la misión">
            ${getMissionOptions().map((option) => `
              <button
                type="button"
                class="mission-option"
                data-length="${option.length}"
                aria-label="Elegir ${option.label.toLowerCase()}: ${option.length} preguntas"
              >
                <span class="mission-option-title">${option.label}</span>
                <span class="mission-option-meta">${option.description}</span>
              </button>
            `).join("")}
          </div>
        </div>`;
      bindElements();
      scoreElement.textContent = "0";
      footerNote.textContent = "Elige una misión para comenzar";
      questionTitle.focus();
      document.querySelectorAll(".mission-option").forEach((button) => {
        button.addEventListener("click", () => startMission(Number(button.dataset.length)));
      });
    }

    function renderQuizView() {
      quizCard.innerHTML = `
        <div class="card-content">
          <div class="topline">
            <p class="eyebrow">Misión de exploración</p>
            <div class="score-pill" aria-live="polite" aria-label="Puntuación">
              <span aria-hidden="true">✦</span> <strong id="score">0</strong><span>puntos</span>
            </div>
          </div>
          <div class="progress-meta">
            <span id="question-count">Pregunta 1 de ${activeQuestions.length}</span>
            <span id="progress-percent">${Math.round(100 / activeQuestions.length)} %</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario" aria-valuemin="0" aria-valuemax="${activeQuestions.length}" aria-valuenow="1" id="progress">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <h1 id="question" tabindex="-1"></h1>
          <p class="subtitle">Elige la respuesta correcta para continuar tu misión.</p>
          <div id="mascot-container"></div>
          <fieldset class="answers" id="answers" aria-label="Opciones de respuesta"></fieldset>
          <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
          <div class="actions">
            <button class="primary-button" id="next-button" type="button" hidden>
              Siguiente pregunta <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>`;
      bindElements();
      scoreElement.textContent = String(score);
      footerNote.textContent = `${activeQuestions.length} preguntas · Sin prisa, cadete espacial`;
    }

    function mascotMarkup(mood = "idle") {
      return `
        <div class="mascot-host" id="mascot-host" data-mood="${mood}" aria-hidden="true">
          <div class="mascot-art">
            <svg class="space-pet" viewBox="0 0 128 126" focusable="false">
              <ellipse class="pet-shadow" cx="64" cy="115" rx="23" ry="5"></ellipse>
              <g class="pet-sparkles">
                <path class="pet-star" d="M20 49l2.4 5.6L28 57l-5.6 2.4L20 65l-2.4-5.6L12 57l5.6-2.4z"></path>
                <path class="pet-star" d="M106 36l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z"></path>
                <path class="pet-star" d="M101 82l1.7 3.8 3.8 1.7-3.8 1.7-1.7 3.8-1.7-3.8-3.8-1.7 3.8-1.7z"></path>
              </g>
              <g class="pet-jet">
                <path class="pet-flame" d="M57 97q7 8 0 13 0-4-4-6 3-2 4-7z"></path>
                <path class="pet-flame" d="M71 97q-7 8 0 13 0-4 4-6-3-2-4-7z"></path>
              </g>
              <g class="pet-arm-left">
                <path d="M43 76 31 84" fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-width="12"></path>
                <circle cx="30" cy="84" r="6" class="pet-suit"></circle>
              </g>
              <g class="pet-arm-right">
                <path d="m85 76 12 8" fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-width="12"></path>
                <circle cx="98" cy="84" r="6" class="pet-suit"></circle>
              </g>
              <g class="pet-body">
                <path class="pet-suit" d="M43 72q21-14 42 0l7 25q-28 16-56 0z"></path>
                <path class="pet-suit-detail" d="M53 73q11 6 22 0l-3 8H56z"></path>
                <rect class="pet-suit-detail" x="55" y="86" width="18" height="12" rx="5"></rect>
                <path d="m64 87 1.5 3.2 3.5.5-2.5 2.5.6 3.4-3.1-1.6-3.1 1.6.6-3.4-2.5-2.5 3.5-.5z" fill="var(--pet-suit)"></path>
                <path class="pet-suit" d="M47 95q-6 4-5 10h14v-7M81 95q6 4 5 10H72v-7"></path>
                <path d="M47 104h9M72 104h9" fill="none" stroke="var(--line)" stroke-linecap="round" stroke-width="2"></path>
              </g>
              <g class="pet-head">
                <path class="pet-ear" d="M47 37C34 18 42 8 51 17l13 17m17 3C94 18 86 8 77 17L64 34"></path>
                <path class="pet-ear-inner" d="M46 29c-5-9-3-12 1-8l9 13m26-5c5-9 3-12-1-8l-9 13"></path>
                <circle class="pet-helmet" cx="64" cy="47" r="34"></circle>
                <ellipse class="pet-fur" cx="64" cy="48" rx="24" ry="23"></ellipse>
                <g class="pet-eyes">
                  <ellipse class="pet-eye" cx="54" cy="46" rx="4" ry="5"></ellipse>
                  <ellipse class="pet-eye" cx="74" cy="46" rx="4" ry="5"></ellipse>
                  <circle class="pet-eye-glint" cx="55.5" cy="44.5" r="1.35"></circle>
                  <circle class="pet-eye-glint" cx="75.5" cy="44.5" r="1.35"></circle>
                </g>
                <ellipse class="pet-cheek" cx="47" cy="55" rx="4.2" ry="2.6"></ellipse>
                <ellipse class="pet-cheek" cx="81" cy="55" rx="4.2" ry="2.6"></ellipse>
                <path class="pet-nose" d="M61 52q3-3 6 0 0 3-3 4-3-1-3-4z"></path>
                <path class="pet-mouth pet-smile" d="M64 56q-2 4-5 2m5-2q2 4 5 2"></path>
                <path class="pet-mouth pet-frown" d="M59 60q5-6 10 0"></path>
                <path class="pet-helmet-glint" d="M39 42q3-15 15-19"></path>
                <path class="pet-helmet-glint" d="m89 56 1-4"></path>
              </g>
            </svg>
          </div>
          <span class="mascot-message"><span class="pet-name">Pipo</span> <span class="mascot-words"></span></span>
        </div>`;
    }

    function updateMascot(mood, message) {
      const mascot = mascotContainer.querySelector("#mascot-host");
      mascot.dataset.mood = mood;
      mascot.querySelector(".mascot-words").textContent = message;
    }

    function renderQuestion() {
      const item = activeQuestions[currentQuestion];
      const number = currentQuestion + 1;
      const totalQuestions = activeQuestions.length;
      hasAnswered = false;
      updateMascot("idle", `¡Vamos con la pregunta ${number}!`);
      questionTitle.textContent = item.question;
      questionTitle.classList.remove("question-enter");
      void questionTitle.offsetWidth;
      questionTitle.classList.add("question-enter");
      questionCountElement.textContent = `Pregunta ${number} de ${totalQuestions}`;
      progressPercent.textContent = `${Math.round(number / totalQuestions * 100)} %`;
      progressElement.setAttribute("aria-valuemax", String(totalQuestions));
      progressElement.setAttribute("aria-valuenow", String(number));
      progressFill.classList.remove("is-advancing");
      void progressFill.offsetWidth;
      progressFill.style.width = `${number / totalQuestions * 100}%`;
      progressFill.classList.add("is-advancing");
      feedbackElement.className = "feedback";
      feedbackElement.textContent = "";
      nextButton.hidden = true;
      nextButton.innerHTML = number === totalQuestions
        ? 'Ver resultados <span aria-hidden="true">→</span>'
        : 'Siguiente pregunta <span aria-hidden="true">→</span>';

      answersElement.replaceChildren(...item.answers.map((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.dataset.index = String(index);
        button.style.setProperty("--answer-index", String(index));
        button.innerHTML = `<span class="letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span class="answer-copy"></span><span class="answer-icon" aria-hidden="true"></span>`;
        button.querySelector(".answer-copy").textContent = answer;
        button.addEventListener("click", () => selectAnswer(index));
        return button;
      }));
    }

    function startMission(length) {
      missionLength = length;
      activeQuestions = questions.slice(0, length);
      currentQuestion = 0;
      score = 0;
      renderQuizView();
      renderQuestion();
      questionTitle.focus();
    }

    function selectAnswer(selectedIndex) {
      if (hasAnswered) return;
      hasAnswered = true;
      const item = activeQuestions[currentQuestion];
      const isCorrect = selectedIndex === item.correct;
      const buttons = [...answersElement.querySelectorAll(".answer")];

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.correct) {
          button.classList.add(isCorrect ? "is-correct" : "show-correct");
          button.querySelector(".answer-icon").textContent = "✓";
        }
        if (index === selectedIndex && !isCorrect) {
          button.classList.add("is-wrong");
          button.querySelector(".answer-icon").textContent = "×";
        }
      });

      if (isCorrect) {
        score += 1;
        scoreElement.textContent = String(score);
        const scorePill = scoreElement.parentElement;
        scorePill.classList.remove("is-celebrating");
        void scorePill.offsetWidth;
        scorePill.classList.add("is-celebrating");
      }

      const mascotMessages = isCorrect
        ? ["¡Lo sabía! ¡Eres increíble!", "¡Respuesta estelar!", "¡Misión cumplida, cadete!"]
        : ["¡Uy! No pasa nada, aprendemos juntos.", "¡Casi! La próxima la atrapamos.", "¡Todo explorador se equivoca alguna vez!"];
      updateMascot(isCorrect ? "correct" : "incorrect", mascotMessages[Math.floor(Math.random() * mascotMessages.length)]);
      feedbackElement.className = `feedback visible ${isCorrect ? "correct" : "incorrect"}`;
      feedbackElement.innerHTML = `<span class="feedback-mark" aria-hidden="true">${isCorrect ? "✓" : "↻"}</span><span class="feedback-copy"><strong></strong><span></span></span>`;
      feedbackElement.querySelector(".feedback-copy strong").textContent = isCorrect ? "¡Sí, lo tienes!" : "¡Casi! Sigue explorando.";
      feedbackElement.querySelector(".feedback-copy span").textContent = item.explanation;
      if (isCorrect) launchConfetti(feedbackElement, 14);
      nextButton.hidden = false;
      nextButton.focus();
    }

    function launchConfetti(container, count) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const burst = document.createElement("span");
      burst.className = "confetti-burst";
      burst.setAttribute("aria-hidden", "true");
      const colors = ["#16a085", "#f4b942", "#ef6b73", "#6888e8", "#a477d5"];

      for (let index = 0; index < count; index += 1) {
        const angle = (Math.PI * 2 * index) / count + (Math.random() - .5) * .5;
        const distance = 34 + Math.random() * 65;
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.setProperty("--piece-x", `${Math.cos(angle) * distance}px`);
        piece.style.setProperty("--piece-y", `${Math.sin(angle) * distance}px`);
        piece.style.setProperty("--piece-rotation", `${Math.random() * 720 - 360}deg`);
        piece.style.setProperty("--piece-size", `${5 + Math.random() * 5}px`);
        piece.style.setProperty("--piece-delay", `${Math.random() * 90}ms`);
        piece.style.setProperty("--piece-color", colors[index % colors.length]);
        burst.append(piece);
      }

      container.append(burst);
      window.setTimeout(() => burst.remove(), 1200);
    }

    function showResults() {
      const totalQuestions = activeQuestions.length;
      const percentage = score / totalQuestions;
      const result = percentage === 1
        ? { emoji: "🏆", title: "¡Misión perfecta!", copy: "Tu conocimiento del espacio está fuera de este mundo. ¡Enhorabuena, cadete!" }
        : percentage >= .7
          ? { emoji: "🚀", title: "¡Gran viaje!", copy: "Tienes madera de explorador espacial. Cada respuesta te acerca a las estrellas." }
          : percentage >= .4
            ? { emoji: "🪐", title: "¡Buen despegue!", copy: "Has dado tus primeros pasos por el cosmos. ¡Hay muchísimas cosas por descubrir!" }
            : { emoji: "🌱", title: "¡A seguir explorando!", copy: "Toda gran misión empieza con curiosidad. Vuelve a intentarlo y descubre cuánto puedes aprender." };

      quizCard.innerHTML = `
        <div class="result">
          ${mascotMarkup(score === totalQuestions ? "perfect" : "result")}
          <p class="eyebrow">Misión completada</p>
          <h1 id="result-title" tabindex="-1">${result.title}</h1>
          <p class="result-copy">${result.copy}</p>
          <div class="result-score" aria-label="Puntuación final: ${score} de ${totalQuestions}">
            <strong>${score}/${totalQuestions}</strong><span>respuestas correctas</span>
          </div>
          <button class="primary-button" id="restart-button" type="button">
            <span aria-hidden="true">↻</span> Volver a jugar
          </button>
        </div>`;
      footerNote.textContent = "Gracias por viajar con Órbita";
      mascotContainer = quizCard;
      updateMascot(score === totalQuestions ? "perfect" : "result", `${result.emoji} ${result.title} ¡Lo lograste!`);
      launchConfetti(document.querySelector(".result"), 32);
      document.querySelector("#restart-button").addEventListener("click", restartQuiz);
      document.querySelector("#result-title").focus();
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      renderQuizView();
      renderQuestion();
      questionTitle.focus();
    }

    function bindElements() {
      questionTitle = document.querySelector("#question");
      answersElement = document.querySelector("#answers");
      scoreElement = document.querySelector("#score");
      questionCountElement = document.querySelector("#question-count");
      progressElement = document.querySelector("#progress");
      progressFill = document.querySelector("#progress-fill");
      progressPercent = document.querySelector("#progress-percent");
      feedbackElement = document.querySelector("#feedback");
      nextButton = document.querySelector("#next-button");
      quizCard = document.querySelector("#quiz");
      footerNote = document.querySelector("#footer-note");
      mascotContainer = document.querySelector("#mascot-container");
      if (mascotContainer) mascotContainer.innerHTML = mascotMarkup();
      if (nextButton) {
        nextButton.addEventListener("click", () => {
          if (!hasAnswered) return;
          if (currentQuestion === activeQuestions.length - 1) {
            showResults();
            return;
          }
          currentQuestion += 1;
          renderQuestion();
          questionTitle.focus();
        });
      }
    }

    bindElements();
    renderMissionSelection();
  </script>
</body>
</html>
